services:
  - type: web
    name: nl-to-sql-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    branch: main
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./sample.db
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: ENABLE_WRITE_MODE
        value: "false"
      - key: ROW_LIMIT
        value: "100"
      - key: QUERY_TIMEOUT
        value: "30"
      - key: ALLOWED_ORIGINS
        sync: false
